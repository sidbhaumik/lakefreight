# Defaults for the migration. Every value marked CHANGE-ME is a placeholder.

[extract]
control_schema = "MIGRATION.CONTROL"        # CHANGE-ME: database.schema holding the control tables
full_threshold_bytes = 107374182400         # 100 GiB: at or below this, one COPY for the whole table
target_chunk_bytes = 80530636800            # 75 GiB: target size of one chunk for larger tables
max_file_size_bytes = 1073741824            # 1 GiB Parquet part files
unmatched_token_threshold = 0               # restricted zone: max non-null tokens with no xref match per chunk
# parquet_file_format = "MIGRATION.CONTROL.LAKEFREIGHT_PARQUET"  # reads unloaded files back; default: control_schema + .LAKEFREIGHT_PARQUET
allow_timestamp_precision_loss = false      # true accepts timestamps cut to the millisecond (Parquet from Snowflake keeps no more)
snapshot = "still_written"                  # read tables as of one snapshot (time travel): none, still_written (STILL_WRITTEN tables) or all
snapshot_window_hours = 12                  # most hours a pinned table's extract may run after planning; checked against its retention

[xref]
table = "SECURE.PUBLIC.TOKEN_XREF"          # CHANGE-ME: fully qualified name
token_column = "TOKEN_VALUE"                # CHANGE-ME
clear_column = "CLEAR_VALUE"                # CHANGE-ME

# One zone per sensitivity class. The stage URL must be s3://<bucket>/<prefix>/.
[zones.INTERNAL]
stage = "MIGRATION.CONTROL.EGRESS_INTERNAL_STAGE"
bucket = "CHANGE-ME-egress"
prefix = "internal"
role = "MIG_INTERNAL_EXTRACT"

[zones.PII]
stage = "MIGRATION.CONTROL.EGRESS_PII_STAGE"
bucket = "CHANGE-ME-egress"
prefix = "pii"
role = "MIG_PII_EXTRACT"

[zones.RESTRICTED]
stage = "MIGRATION.CONTROL.EGRESS_RESTRICTED_STAGE"
bucket = "CHANGE-ME-egress-restricted"
prefix = "restricted"
role = "MIG_RESTRICTED_EXTRACT"                    # the only role with SELECT on the xref

# One lane per Step Functions execution, each with its own warehouse.
[lanes.LARGE]
warehouse = "MIG_LARGE_WH"
max_concurrency = 8

[lanes.SMALL]
warehouse = "MIG_SMALL_WH"
max_concurrency = 32

[lanes.RESTRICTED]
warehouse = "MIG_RESTRICTED_WH"
max_concurrency = 4

# How `lakefreight discover` builds the metadata CSV from Snowflake.
[discover]
# "account_usage": one query across databases; needs access to the SNOWFLAKE
#   database and lags changes by up to a few hours.
# "information_schema": current state, per database; tags still come from
#   ACCOUNT_USAGE when any tag rule below is in use.
source = "account_usage"
exclude_schemas = ["INFORMATION_SCHEMA"]

# Use Snowflake's sensitive data classification. A column tagged with
# SNOWFLAKE.CORE.PRIVACY_CATEGORY is personal data. In a table Snowflake has
# classified, any other column is not. In a table it has not classified, the
# column's status is unknown, and lakefreight treats it as personal data.
use_snowflake_classification = true

# More rules. A tag is "DATABASE.SCHEMA.TAG" or "DATABASE.SCHEMA.TAG=VALUE".
# Column patterns are case-insensitive regular expressions on column names.
pii_tags = []
pii_column_patterns = []
# Restricted columns hold tokens that are swapped for clear values on extract.
restricted_tags = []
restricted_column_patterns = []

# Only for estates you know hold no personal data: report unclassified columns
# as not personal data, so their tables go to the INTERNAL zone.
treat_unclassified_as_non_pii = false
