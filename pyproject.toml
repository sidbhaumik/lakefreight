[project]
name = "lakefreight"
version = "1.0.0"
description = "Bulk-move warehouse tables into open lakehouse files on cloud storage, for any engine to read"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1"]
keywords = ["snowflake", "s3", "parquet", "data-migration", "lakehouse", "databricks", "redshift", "bigquery", "delta-lake", "iceberg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/sidbhaumik/lakefreight"
Documentation = "https://github.com/sidbhaumik/lakefreight/tree/main/docs"
Issues = "https://github.com/sidbhaumik/lakefreight/issues"

[project.scripts]
lakefreight = "lakefreight.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyarrow>=14",
    "deltalake>=1.0",
    "pyiceberg[sql-sqlite]>=0.9",
    "duckdb>=1.0",
    "sqlglot>=25",
]
# Register unloaded files as open table formats (lakefreight register).
delta = ["pyarrow>=14", "deltalake>=1.0"]
iceberg = ["pyarrow>=14", "pyiceberg>=0.9"]
# Connect to Snowflake (lakefreight discover).
snowflake = ["snowflake-connector-python>=3.12"]
# Needed only to run against Snowflake and AWS (planning.py, handlers.py).
pipeline = ["snowflake-connector-python>=3.12", "boto3>=1.34"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lakefreight = ["templates/*.j2", "defaults.toml", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long SQL strings and messages stay readable
