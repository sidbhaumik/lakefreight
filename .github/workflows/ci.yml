name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Run the README quickstart
        run: lakefreight plan --metadata examples/metadata_sample.csv --profiles examples/profiles_sample.csv --out generated

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - name: Plan with mocked Snowflake and offline AWS, and check the result
        run: tofu test

  lambda-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: infra/build_lambda.sh x86_64
      - name: Import the handlers on the AWS Lambda Python 3.13 runtime image
        run: |
          mkdir -p /tmp/task && unzip -q build/lakefreight-lambda.zip -d /tmp/task
          docker run --rm -v /tmp/task:/var/task:ro --entrypoint python \
            public.ecr.aws/lambda/python:3.13 -c "
          import lakefreight.handlers as h, snowflake.connector
          from lakefreight.config import load_settings
          assert all(callable(getattr(h, f)) for f in ('list_items', 'submit', 'poll', 'reconcile'))
          load_settings()
          print('handlers import on the Lambda runtime; connector', snowflake.connector.__version__)
          "

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and run it outside the source tree
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/lakefreight --version
          /tmp/wheel-env/bin/lakefreight plan --metadata "$GITHUB_WORKSPACE/examples/metadata_sample.csv" --out /tmp/generated
