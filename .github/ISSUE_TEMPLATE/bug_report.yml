name: Bug report
description: Something lakefreight did wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use **Security → Report a vulnerability** instead (see SECURITY.md).
        Remove real table names, data and account identifiers before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Include the full error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest metadata CSV, settings or commands that show the problem.
  - type: input
    id: version
    attributes:
      label: lakefreight version
      description: Output of `lakefreight --version`
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - discover
        - plan (SQL generation and chunking)
        - register (Delta Lake or Iceberg)
        - Step Functions pipeline and Lambda functions
        - infra/terraform
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, Snowflake connector version, and for Terraform the tool and provider versions.
